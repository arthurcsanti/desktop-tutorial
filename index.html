<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lastro</title>
<meta name="description" content="Lastro — finanças pessoais, offline e criptografadas no seu iPhone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lastro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FBFBFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>
  try { var t = localStorage.getItem('lastro-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<section id="lock" class="lock" aria-label="Lastro"></section>

<div id="app" class="app" hidden>
  <aside class="sidebar" aria-label="Navegação">
    <div class="side-brand">
      <img src="icons/logo.svg" alt="" width="28" height="28">
      <div><strong>Lastro</strong><span>Finanças pessoais</span></div>
    </div>
    <nav class="side-nav"></nav>
    <button class="side-import" data-action="import">Importar extrato</button>
    <div class="side-foot">Offline · AES-256</div>
  </aside>
  <main id="view" class="view"></main>
  <nav class="tabbar" aria-label="Abas"></nav>
</div>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grabber"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
